applications:
  learning_log:
    type: "python:3.12"

    hooks:
      build: |
        pip install --upgrade pip
        pip install -r requirements.txt
        python manage.py collectstatic --noinput

    web:
      upstream:
        socket_family: unix
      commands:
        # Binds gunicorn precisely to Upsun's assigned internal unix socket path
        start: "gunicorn -w 4 -b unix:$SOCKET learning_log.wsgi:application"
      locations:
        "/":
          passthru: true
        "/static":
          root: "static"
          allow: true

routes:
  "https://{default}/":
    type: upstream
    upstream: "learning_log:http"
