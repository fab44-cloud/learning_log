applications:
  app:
    type: "python:3.12"

    hooks:
      build: |
        pip install --upgrade pip
        pip install -r requirements.txt
        python manage.py collectstatic --noinput

    web:
      upstream:
        socket_family: unix
      commands:
        # Changed learning_log.wsgi to ll_project.wsgi
        start: "gunicorn -w 4 -b unix:$SOCKET ll_project.wsgi:application"
      locations:
        "/":
          passthru: true
        "/static":
          root: "static"
          allow: true

routes:
  "https://{default}/":
    type: upstream
    upstream: "app:http"
