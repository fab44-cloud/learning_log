# Top-level block containing your app container settings
applications:
  learning_log:
    type: "python:3.11"

    hooks:
      # Keeps the book's exact build hooks
      build: |
        pip install --upgrade pip
        pip install -r requirements.txt
        python manage.py collectstatic --noinput

    web:
      upstream:
        socket_family: unix
      commands:
        # Keeps the book's exact start command
        start: gunicorn learning_log.wsgi:application

# Top-level block mapping web requests to your learning_log app
routes:
  "https://{default}/":
    type: upstream
    upstream: "learning_log:http"
