applications:
  learning_log:
    type: "python:3.12"

    hooks:
      build: |
        pip install --upgrade pip
        pip install -r requirements.txt
        python manage.py collectstatic --noinput

    web:
      upstream:
        socket_family: tcp
        protocol: http
      commands:
        start: "gunicorn -b 0.0.0.0:$PORT learning_log.wsgi:application"
      locations:
        "/":
          passthru: true
        "/static":
          root: "static"
          allow: true

routes:
  "https://{default}/":
    type: upstream
    upstream: "learning_log:http"
