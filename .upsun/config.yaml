applications:
  learning_log:
    type: "python:3.11"

    hooks:
      build: |
        pip install --upgrade pip
        pip install -r requirements.txt
      deploy: |
        python manage.py migrate

    web:
      upstream:
        socket_family: unix
      commands:
        start: "gunicorn -w 4 -b unix:$SOCKET learning_log.wsgi:application"
      locations:
        "/":
          passthru: true
        "/static":
          root: "static"
          expires: 1h
          allow: true

    mounts:
      "static":
        source: storage
        source_path: static

services:
  db:
    type: postgresql:15

routes:
  "https://{default}/":
    type: upstream
    upstream: "learning_log:http"
