applications:
  app:
    type: python:3.12

    mounts:
      "db":
        source: storage
        source_path: db

    web:
      commands:
        start: gunicorn ll_project.wsgi:application --bind 0.0.0.0:$PORT

    hooks:
      # 1. The Build Hook installs your packages into the live runtime container
      build: |
        pip install --upgrade pip
        pip install -r requirements.txt

      # 2. The Deploy Hook runs migrations once the container filesystem mounts
      deploy: |
        mkdir -p db
        touch db/db.sqlite3
        python manage.py migrate --noinput
